
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz App</title>

<style>

body{
font-family: Arial;
background:#f4f4f4;
text-align:center;
}

.quiz-container{
background:white;
width:500px;
margin:50px auto;
padding:30px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

button{
padding:8px 14px;
margin:5px;
cursor:pointer;
border:none;
background:#333;
color:white;
border-radius:5px;
}

button:hover{
background:#555;
}

.progress{
width:100%;
height:20px;
background:#ddd;
border-radius:10px;
margin-top:15px;
}

.progress-bar{
height:100%;
width:0%;
background:green;
border-radius:10px;
transition:0.3s;
}

table{
margin:30px auto;
border-collapse:collapse;
}

th,td{
border:1px solid #999;
padding:8px 12px;
}

.correct{
background:#c8f7c5;
}

.wrong{
background:#f7c5c5;
}

</style>
</head>

<body>

<div class="quiz-container">

<h2 id="question"></h2>

<div id="options"></div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<br>
<button id="nextBtn">Next</button>

</div>

<div id="result"></div>


<script>

const questions = [

{
question:"Q1: Capital of France?",
options:["Paris","London","Rome","Berlin"],
answer:"Paris"
},

{
question:"Q2: 2 + 2 = ?",
options:["3","4","6","8"],
answer:"4"
},

{
question:"Q3: JS full form?",
options:["JavaScript","Java","JScript","JS"],
answer:"JavaScript"
},

{
question:"Q4: Earth shape?",
options:["Square","Triangle","Round","Flat"],
answer:"Round"
},

{
question:"Q5: HTML stands for?",
options:["Hyper Text Markup Language","Home Tool Markup Language","High Text Machine Language","None"],
answer:"Hyper Text Markup Language"
}

];

let currentQuestion = 0;
let userAnswers = [];

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const progressBar = document.getElementById("progressBar");

function loadQuestion(){

const q = questions[currentQuestion];

questionEl.textContent = q.question;

optionsEl.innerHTML = "";

q.options.forEach(option=>{

const btn = document.createElement("button");

btn.textContent = option;

btn.onclick = ()=>{
userAnswers[currentQuestion] = option;
};

optionsEl.appendChild(btn);

});

updateProgress();

}

function updateProgress(){

let progress = ((currentQuestion) / questions.length) * 100;
progressBar.style.width = progress + "%";

}

document.getElementById("nextBtn").onclick = ()=>{

if(currentQuestion < questions.length-1){

currentQuestion++;
loadQuestion();

}
else{

showResult();

}

};

function showResult(){

document.querySelector(".quiz-container").style.display="none";

let html = "<h2>Quiz Result</h2>";

html += "<table>";
html += "<tr><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Mark</th></tr>";

questions.forEach((q,i)=>{

let correct = q.answer;
let user = userAnswers[i];

let mark = user === correct ? 1 : 0;

let rowClass = user === correct ? "correct" : "wrong";

html += `<tr class="${rowClass}">
<td>${q.question}</td>
<td>${user || "No Answer"}</td>
<td>${correct}</td>
<td>${mark}</td>
</tr>`;

});

html += "</table>";

document.getElementById("result").innerHTML = html;

progressBar.style.width = "100%";

}

loadQuestion();

</script>

</body>
</html>
