<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Task</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #f4f4f4;
            height: 2000px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            height: 60px;
            background-color: #2c3e50;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .hero {
            display: flex;
            justify-content: center;
            padding-top: 100px;
        }

        .relative-container {
            position: relative;
            width: 400px;
            height: 250px;
            background-color: white;
            border: 2px solid #ddd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .absolute-element {
            position: absolute;
            top: -15px;
            right: -15px;
            background-color: #e74c3c;
            color: white;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
        }

        .fixed-element {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #27ae60;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">StickyNav</div>
        <ul class="nav-links">
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>

    <div class="hero">
        <div class="relative-container">
            <div class="absolute-element">ABSOLUTE</div>
            <h2>Relative Box</h2>
            <p>The red badge is positioned absolutely to this container.</p>
        </div>
    </div>

    <div class="fixed-element">
        FIXED WIDGET
    </div>

</body>
</html>
