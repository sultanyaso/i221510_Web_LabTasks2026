<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
<style>
    /* General Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Roboto', sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card Container */
.card {
    background-color: #ffffff;
    width: 280px;
    padding: 40px 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    text-align: center;
}

/* Profile Image */
.image-container {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid #1abc9c;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Typography */
.name {
    font-size: 1.2rem;
    color: #2c3e50;
    margin-bottom: 5px;
}

.degree {
    font-size: 0.9rem;
    color: #95a5a6;
    margin-bottom: 5px;
}

.role {
    font-size: 0.95rem;
    color: #1abc9c;
    font-weight: 500;
    margin-bottom: 25px;
}

/* Button */
.btn {
    background-color: #1abc9c;
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.btn:hover {
    background-color: #16a085;
}
</style>
</head>
<body>

    <div class="card">
        <div class="image-container">
            <img src="me2.jpeg" alt="Profile">
        </div>
        <h2 class="name">Yasir Sultan</h2>
        <p class="degree">BS Software Engineering</p>
        <p class="role">Frontend Developer</p>
        <button class="btn">View Profile</button>
    </div>

</body>
</html>
