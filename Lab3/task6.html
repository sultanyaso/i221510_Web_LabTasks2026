<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Student Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
        }

        
        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr 40px;
            grid-template-areas: 
                "header header"
                "sidebar main"
                "footer footer";
            height: 100vh;
        }

        .header {
            grid-area: header;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #ecf0f1;
            padding: 20px;
            border-right: 1px solid #dcdde1;
        }

        .main-content {
            grid-area: main;
            background-color: white;
            padding: 40px;
            position: relative; 
        }

        .footer {
            grid-area: footer;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            background-color: #bdc3c7;
            padding: 10px 15px;
            text-align: left;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item:hover {
            background-color: #95a5a6;
        }

        .course-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .course-card {
            flex: 1;
            background-color: #d1e9f6;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .course-card:hover {
            transform: scale(1.05);
            background-color: #b3d9ff;
        }

       
        .badge {
            position: absolute;
            top: 40px;
            right: 40px;
            background-color: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            Student Portal
        </header>

        <aside class="sidebar">
            <div class="nav-menu">
                <div class="nav-item">Dashboard</div>
                <div class="nav-item">Profile</div>
                <div class="nav-item">Courses</div>
                <div class="nav-item">Settings</div>
            </div>
        </aside>

        <main class="main-content">
            <span class="badge">New</span>
            <h2>My Courses</h2>
            
            <div class="course-container">
                <div class="course-card">Web Engineering</div>
                <div class="course-card">Data Science</div>
                <div class="course-card">AI Systems</div>
            </div>
        </main>

        <footer class="footer">
            &copy; 2026 CSS Lab
        </footer>
    </div>

</body>
</html>
