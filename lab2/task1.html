<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Search Portal</title>
</head>
<body>
    <div class="continer">
    <div class="icon">🔍</div>
    <h1>Course Search Portal</h1>
    <h2>Find your courses quickly using the search form</h2>

    <form action="search-results.html" method="GET">

          <label for="course">Course Name:</label>
          <input type="text" id="course" name="course" placeholder="e.g. AI,Web">

          <label for="department">Department:</label>
          <select id="department" name="department">
            <option value="CS">Computer Science</option>
            <option value="DS">Data Science</option>
            <option value="NET">Networking</option>
            <option value="SE">Software Engineering</option>
          </select>

          <button type="submit">Search Courses</button>
    </form>
    </div>
</body>

</html>
