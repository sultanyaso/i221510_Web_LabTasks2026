<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Borrowing System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8f0; --surface: #fffdf9; --card: #fff;
    --border: #e8dcc8; --accent: #b5451b; --accent2: #2d6a4f;
    --gold: #c9a84c; --text: #1a120b; --muted: #7a6652; --light: #c4b49e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 1fr 380px; min-height: 100vh; }
  /* Left Panel */
  .left-panel { padding: 32px; border-right: 1px solid var(--border); }
  .library-header { margin-bottom: 28px; }
  .library-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .logo-icon { font-size: 2rem; }
  .logo-text { font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .logo-sub { font-size: 0.75rem; color: var(--muted); font-weight: 500; letter-spacing: 0.5px; }
  .search-filter { display: flex; gap: 10px; margin-bottom: 20px; }
  .search-input {
    flex: 1; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 0.85rem; background: var(--card);
    color: var(--text); outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .genre-filter {
    padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 0.82rem; background: var(--card);
    color: var(--text); outline: none; cursor: pointer;
  }
  .results-info { font-size: 0.78rem; color: var(--muted); margin-bottom: 16px; }
  .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .book-card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; gap: 14px; transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .book-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: var(--accent); border-radius: 14px 0 0 14px; opacity: 0;
    transition: opacity 0.2s;
  }
  .book-card:hover { border-color: var(--accent); transform: translateX(4px); }
  .book-card:hover::before { opacity: 1; }
  .book-cover {
    width: 56px; height: 76px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
    box-shadow: 2px 3px 8px rgba(0,0,0,0.12);
  }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-family: 'Lora', serif; font-size: 0.95rem; font-weight: 600; margin-bottom: 3px; line-height: 1.3; }
  .book-author { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; font-style: italic; }
  .book-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .book-tag {
    font-size: 0.68rem; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    background: #f5ede0; color: var(--accent);
  }
  .book-available { font-size: 0.72rem; color: var(--accent2); font-weight: 600; }
  .book-available.low { color: #d97706; }
  .book-available.out { color: var(--accent); }
  .borrow-btn {
    padding: 7px 16px; border-radius: 8px; border: 1.5px solid var(--accent);
    background: transparent; color: var(--accent);
    font-family: 'Inter', sans-serif; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
    align-self: center;
  }
  .borrow-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .borrow-btn.borrowed { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .borrow-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  /* Right Panel - Borrow Cart */
  .right-panel { background: var(--surface); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .cart-header { padding: 28px 24px 18px; border-bottom: 1px solid var(--border); }
  .cart-title { font-family: 'Lora', serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
  .cart-subtitle { font-size: 0.75rem; color: var(--muted); }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .cart-empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .cart-empty-icon { font-size: 3rem; margin-bottom: 12px; }
  .cart-empty-text { font-family: 'Lora', serif; font-size: 1rem; }
  .cart-item {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px;
  }
  .cart-item-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .cart-item-icon { font-size: 1.4rem; flex-shrink: 0; }
  .cart-item-title { font-family: 'Lora', serif; font-size: 0.88rem; font-weight: 600; line-height: 1.3; }
  .cart-item-author { font-size: 0.72rem; color: var(--muted); }
  .remove-item { margin-left: auto; background: none; border: none; color: var(--light); cursor: pointer; font-size: 1.1rem; transition: color 0.15s; }
  .remove-item:hover { color: var(--accent); }
  .cart-item-footer { display: flex; align-items: center; justify-content: space-between; }
  .qty-control { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 6px; border: 1.5px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 1rem; display: flex;
    align-items: center; justify-content: center; transition: all 0.15s; font-weight: 600;
  }
  .qty-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .qty-num { font-size: 0.9rem; font-weight: 700; min-width: 24px; text-align: center; }
  .qty-label { font-size: 0.7rem; color: var(--muted); }
  /* Summary */
  .cart-summary { padding: 18px 20px; border-top: 1px solid var(--border); background: var(--card); }
  .summary-title { font-family: 'Lora', serif; font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; color: var(--accent); }
  .summary-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 5px 0; }
  .summary-row.total { font-weight: 700; font-size: 1rem; border-top: 1.5px solid var(--border); padding-top: 10px; margin-top: 6px; }
  .summary-val { font-weight: 600; color: var(--text); }
  .summary-days { font-size: 0.7rem; color: var(--muted); }
  .borrow-all-btn {
    width: 100%; margin-top: 14px; padding: 13px; border-radius: 10px;
    background: var(--accent); color: #fff; border: none;
    font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .borrow-all-btn:hover:not(:disabled) { background: #9a3516; }
  .borrow-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .clear-btn { width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; background: transparent; border: 1.5px solid var(--border); font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; color: var(--muted); cursor: pointer; }
  .clear-btn:hover { border-color: var(--accent); color: var(--accent); }
  .success-toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--accent2); color: #fff;
    padding: 14px 22px; border-radius: 12px; font-size: 0.85rem; font-weight: 600;
    box-shadow: 0 8px 24px rgba(45,106,79,0.3); z-index: 999;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .top-stats { display: flex; gap: 12px; margin-bottom: 20px; }
  .mini-stat { flex: 1; background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .mini-stat-val { font-size: 1.4rem; font-weight: 800; color: var(--accent); font-family: 'Lora', serif; }
  .mini-stat-label { font-size: 0.68rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useReducer, useMemo, useState, useEffect } = React;

// ─── Redux-like Store ─────────────────────────────────────────────────────────
const BOOKS = [
  { id:1,  title:'Clean Code',                   author:'Robert C. Martin',  genre:'Programming',  icon:'💻', color:'#1e3a5f', copies:3 },
  { id:2,  title:'The Pragmatic Programmer',      author:'Andrew Hunt',       genre:'Programming',  icon:'🔧', color:'#2d6a4f', copies:2 },
  { id:3,  title:'Design Patterns',               author:'Gang of Four',      genre:'Programming',  icon:'🏗️', color:'#4a1942', copies:1 },
  { id:4,  title:'Sapiens',                       author:'Yuval Noah Harari', genre:'History',      icon:'🌍', color:'#7c4f1a', copies:4 },
  { id:5,  title:'Thinking, Fast and Slow',       author:'Daniel Kahneman',   genre:'Psychology',   icon:'🧠', color:'#1a4f5c', copies:2 },
  { id:6,  title:'The Alchemist',                 author:'Paulo Coelho',      genre:'Fiction',      icon:'✨', color:'#5c3d1a', copies:5 },
  { id:7,  title:'Atomic Habits',                 author:'James Clear',       genre:'Self-Help',    icon:'⚡', color:'#1a3d5c', copies:3 },
  { id:8,  title:'Introduction to Algorithms',    author:'Cormen et al.',     genre:'Programming',  icon:'📐', color:'#3d1a5c', copies:2 },
  { id:9,  title:'The Great Gatsby',              author:'F. Scott Fitzgerald',genre:'Fiction',     icon:'🥂', color:'#5c1a1a', copies:3 },
  { id:10, title:'1984',                          author:'George Orwell',     genre:'Dystopia',     icon:'👁️', color:'#1a1a3d', copies:4 },
  { id:11, title:'Rich Dad Poor Dad',             author:'Robert Kiyosaki',   genre:'Finance',      icon:'💰', color:'#3d5c1a', copies:2 },
  { id:12, title:'Brief History of Time',         author:'Stephen Hawking',   genre:'Science',      icon:'🌌', color:'#1a3d3d', copies:1 },
];

// Actions
const ADD_BOOK    = 'ADD_BOOK';
const REMOVE_BOOK = 'REMOVE_BOOK';
const UPDATE_QTY  = 'UPDATE_QTY';
const CLEAR_CART  = 'CLEAR_CART';

// Reducer
function cartReducer(state, action) {
  switch (action.type) {
    case ADD_BOOK: {
      const exists = state.find(i => i.id === action.book.id);
      if (exists) return state.map(i => i.id === action.book.id ? { ...i, qty: i.qty + 1 } : i);
      return [...state, { ...action.book, qty: 1 }];
    }
    case REMOVE_BOOK: return state.filter(i => i.id !== action.id);
    case UPDATE_QTY:  return state
      .map(i => i.id === action.id ? { ...i, qty: Math.max(1, i.qty + action.delta) } : i);
    case CLEAR_CART:  return [];
    default: return state;
  }
}

// Selectors
const selectTotalBooks = cart => cart.reduce((s, i) => s + i.qty, 0);
const selectUniqueBooks = cart => cart.length;
const selectCartIds = cart => cart.map(i => i.id);

// ─── Components ───────────────────────────────────────────────────────────────
function BookCard({ book, inCart, onBorrow }) {
  const availColor = book.copies === 0 ? 'out' : book.copies === 1 ? 'low' : '';
  return (
    <div className="book-card">
      <div className="book-cover" style={{ background: book.color + '22', color: book.color }}>
        {book.icon}
      </div>
      <div className="book-info">
        <div className="book-title">{book.title}</div>
        <div className="book-author">by {book.author}</div>
        <div className="book-meta">
          <span className="book-tag">{book.genre}</span>
          <span className={`book-available ${availColor}`}>
            {book.copies === 0 ? '✗ Out of Stock' : book.copies === 1 ? '⚠ Last Copy' : `✓ ${book.copies} Available`}
          </span>
        </div>
      </div>
      <button
        className={`borrow-btn ${inCart ? 'borrowed' : ''}`}
        onClick={() => onBorrow(book)}
        disabled={book.copies === 0}
      >
        {inCart ? '✓ Added' : 'Borrow'}
      </button>
    </div>
  );
}

function CartItem({ item, onRemove, onUpdateQty }) {
  return (
    <div className="cart-item">
      <div className="cart-item-header">
        <span className="cart-item-icon">{item.icon}</span>
        <div>
          <div className="cart-item-title">{item.title}</div>
          <div className="cart-item-author">by {item.author}</div>
        </div>
        <button className="remove-item" onClick={() => onRemove(item.id)}>✕</button>
      </div>
      <div className="cart-item-footer">
        <div className="qty-control">
          <button className="qty-btn" onClick={() => onUpdateQty(item.id, -1)}>−</button>
          <span className="qty-num">{item.qty}</span>
          <button className="qty-btn" onClick={() => onUpdateQty(item.id, 1)}>+</button>
          <span className="qty-label">copies</span>
        </div>
        <span style={{fontSize:'0.75rem', color:'var(--muted)', fontWeight:600}}>
          Due in {14 * item.qty}d
        </span>
      </div>
    </div>
  );
}

function App() {
  const [cart, dispatch] = useReducer(cartReducer, []);
  const [search, setSearch] = useState('');
  const [genre, setGenre] = useState('All');
  const [toast, setToast] = useState(null);

  const cartIds = useMemo(() => selectCartIds(cart), [cart]);
  const totalBooks = useMemo(() => selectTotalBooks(cart), [cart]);
  const uniqueBooks = useMemo(() => selectUniqueBooks(cart), [cart]);

  const genres = ['All', ...new Set(BOOKS.map(b => b.genre))];

  const filtered = useMemo(() => BOOKS.filter(b => {
    const q = search.toLowerCase();
    return (genre === 'All' || b.genre === genre)
      && (b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q));
  }), [search, genre]);

  const handleBorrow = (book) => {
    dispatch({ type: ADD_BOOK, book });
    setToast(`"${book.title.slice(0, 25)}..." added to cart`);
    setTimeout(() => setToast(null), 2500);
  };

  const handleConfirmBorrow = () => {
    dispatch({ type: CLEAR_CART });
    setToast(`✓ ${totalBooks} books borrowed successfully!`);
    setTimeout(() => setToast(null), 3000);
  };

  return (
    <div className="layout">
      {/* Left */}
      <div className="left-panel">
        <div className="library-header">
          <div className="library-logo">
            <span className="logo-icon">📚</span>
            <div>
              <div className="logo-text">CityLib</div>
              <div className="logo-sub">Library Management System</div>
            </div>
          </div>
          <div className="top-stats">
            <div className="mini-stat"><div className="mini-stat-val">{BOOKS.length}</div><div className="mini-stat-label">Total Books</div></div>
            <div className="mini-stat"><div className="mini-stat-val">{BOOKS.filter(b=>b.copies>0).length}</div><div className="mini-stat-label">Available</div></div>
            <div className="mini-stat"><div className="mini-stat-val">{genres.length - 1}</div><div className="mini-stat-label">Genres</div></div>
          </div>
        </div>
        <div className="search-filter">
          <input
            className="search-input"
            placeholder="🔍  Search by title or author..."
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
          <select className="genre-filter" value={genre} onChange={e => setGenre(e.target.value)}>
            {genres.map(g => <option key={g}>{g}</option>)}
          </select>
        </div>
        <div className="results-info">Showing <strong>{filtered.length}</strong> of {BOOKS.length} books</div>
        <div className="books-grid">
          {filtered.map(book => (
            <BookCard
              key={book.id}
              book={book}
              inCart={cartIds.includes(book.id)}
              onBorrow={handleBorrow}
            />
          ))}
        </div>
      </div>

      {/* Right: Cart */}
      <div className="right-panel">
        <div className="cart-header">
          <div className="cart-title">📖 Borrow Cart</div>
          <div className="cart-subtitle">Selected books for borrowing</div>
        </div>
        <div className="cart-items">
          {cart.length === 0 ? (
            <div className="cart-empty">
              <div className="cart-empty-icon">📭</div>
              <div className="cart-empty-text">No books selected</div>
              <div style={{fontSize:'0.78rem', color:'var(--light)', marginTop:8}}>Click "Borrow" on any book to add it here</div>
            </div>
          ) : cart.map(item => (
            <CartItem
              key={item.id}
              item={item}
              onRemove={id => dispatch({ type: REMOVE_BOOK, id })}
              onUpdateQty={(id, delta) => dispatch({ type: UPDATE_QTY, id, delta })}
            />
          ))}
        </div>
        {cart.length > 0 && (
          <div className="cart-summary">
            <div className="summary-title">Borrowing Summary</div>
            {cart.map(item => (
              <div className="summary-row" key={item.id}>
                <span style={{color:'var(--muted)'}}>{item.title.slice(0,22)}{item.title.length>22?'…':''}</span>
                <span className="summary-val">{item.qty}x</span>
              </div>
            ))}
            <div className="summary-row total">
              <span>Total Books</span>
              <span className="summary-val">{totalBooks} copies ({uniqueBooks} titles)</span>
            </div>
            <div style={{fontSize:'0.72rem', color:'var(--muted)', marginTop:6}}>
              📅 Borrowing period: 14 days per book
            </div>
            <button className="borrow-all-btn" onClick={handleConfirmBorrow}>
              Confirm Borrow ({totalBooks} books)
            </button>
            <button className="clear-btn" onClick={() => dispatch({ type: CLEAR_CART })}>
              Clear Cart
            </button>
          </div>
        )}
      </div>

      {toast && <div className="success-toast">✓ {toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
