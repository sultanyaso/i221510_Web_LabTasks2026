<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Member Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">

    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg border border-gray-100 flex flex-col md:flex-row items-center md:items-start gap-6 max-w-md md:max-w-xl transition-all duration-300 ease-in-out hover:shadow-2xl hover:bg-slate-50">
        
        <div class="flex-shrink-0">
            <img 
                src="me2.jpeg" 
                alt="Yasir Sultan" 
                class="h-24 w-24 md:h-32 md:w-32 rounded-full object-cover shadow-md transition-transform duration-300 hover:scale-105"
            >
        </div>

        <div class="text-center md:text-left">
            <h2 class="text-xl md:text-2xl font-bold text-gray-800">Yasir Sultan</h2>
            <p class="text-gray-600 mt-2 text-sm md:text-base leading-relaxed">
                Frontend Developer passionate about responsive design and creating seamless user experiences.
            </p>

            <div class="mt-4 flex justify-center md:justify-start space-x-4">
                <a href="#" class="text-gray-500 hover:text-blue-600 transition-all duration-300 transform hover:scale-110 flex items-center gap-1 font-medium text-sm">
                    GitHub
                </a>
                <a href="#" class="text-gray-500 hover:text-blue-700 transition-all duration-300 transform hover:scale-110 flex items-center gap-1 font-medium text-sm">
                    LinkedIn
                </a>
                <a href="#" class="text-gray-500 hover:text-emerald-600 transition-all duration-300 transform hover:scale-110 flex items-center gap-1 font-medium text-sm">
                    Portfolio
                </a>
            </div>
        </div>

    </div>

</body>
</html>
